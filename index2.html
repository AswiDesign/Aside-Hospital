<body>
    <section id="page1" class="active">
        <div class="page1">
            <h3>Patient Registration</h3>
            <div class="a">
                <div class="name">
                    <label for="text">Patient name</label>
                    <input type="text" placeholder="Patient name">
                </div>

                <div class="phn-number">
                    <label for="number">Phone number</label>
                    <input type="number" placeholder="Mobile Number">
                </div>
            </div>
            <div class="b">
                <div class="blood-group">
                    <label for="blood">Blood group</label>
                    <select name="blood" id="blood-group">
                        <option value="select">Select blood-group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="dept">
                    <label for="text">Department</label>
                    <select name="dept" id="dept">
                        <option value="select">Select Dept</option>
                        <option value="general">General</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="gynocology">Gynocology</option>
                        <option value="neurology">Neurology</option>
                        <option value="oncology">Oncology</option>
                        <option value="urology">Urology</option>
                        <option value="psycology">Psycology</option>
                    </select>
                </div>
            </div>
            <div class="doc">
                <label for="text">Doctor Name</label>
                <input type="text" placeholder="Doctor name">
            </div>

            <a href=""><button class="submit">Submit</button></a>
            
        </div>
    </section>
</body>
